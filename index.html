<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Démo WebGPU : 100 000 Instances</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: white; font-family: sans-serif; }
        canvas { width: 100vw; height: 100vh; display: block; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="info">
        <b>WebGPU Performance</b><br>
        Objets : 100 000<br>
        Boucles JS : 0 (Tout sur GPU)<br>
        Statut : <span id="status">Initialisation...</span>
    </div>
    <canvas id="gpuCanvas"></canvas>

<script type="module">
    async function init() {
        if (!navigator.gpu) {
            document.getElementById('status').innerText = "WebGPU non supporté par ce navigateur.";
            return;
        }

        const adapter = await navigator.gpu.requestAdapter();
        const device = await adapter.requestDevice();
        const canvas = document.getElementById("gpuCanvas");
        const context = canvas.getContext("webgpu");
        const format = navigator.gpu.getPreferredCanvasFormat();

        // Ajuster la taille du canvas
        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;

        context.configure({ device, format });

        // LE SHADER (WGSL)
        // Note : On utilise 'u32' pour les calculs binaires et le modulo
        const shaderModule = device.createShaderModule({
            code: `
            struct Uniforms {
                time : f32,
                width : f32,
                height : f32,
            }
            @group(0) @binding(0) var<uniform> ui : Uniforms;

            struct VertexOut {
                @builtin(position) pos : vec4f,
                @location(0) color : vec3f,
            }

            @vertex
            fn vs_main(@builtin(vertex_index) vIdx : u32, @builtin(instance_index) iIdx : u32) -> VertexOut {
                // Création d'un carré (2 triangles)
                var positions = array<vec2f, 6>(
                    vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(-1.0, 1.0),
                    vec2f(-1.0, 1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0)
                );

                // Logique binaire et mathématique pour placer les 100 000 instances
                let gridWidth = 400u;
                let xIdx = f32(iIdx % gridWidth);
                let yIdx = f32(iIdx / gridWidth);

                // Animation : Chaque carré ondule selon le temps et sa position
                let offset = sin(ui.time + xIdx * 0.1) * 5.0 + cos(ui.time + yIdx * 0.1) * 5.0;

                let size = 1.5;
                let posX = (xIdx * 4.0 - 800.0) + offset;
                let posY = (yIdx * 4.0 - 500.0) + offset;

                // Projection simple pour centrer à l'écran
                let screenPos = vec2f(posX / (ui.width / 2.0), posY / (ui.height / 2.0));

                var out: VertexOut;
                out.pos = vec4f(positions[vIdx] * size / 100.0 + screenPos, 0.0, 1.0);

                // Couleur binaire basée sur l'ID de l'instance
                out.color = vec3f(
                    f32(iIdx % 255u) / 255.0,
                    f32((iIdx / 255u) % 255u) / 255.0,
                    sin(ui.time) * 0.5 + 0.5
                );
                return out;
            }

            @fragment
            fn fs_main(@location(0) color : vec3f) -> @location(0) vec4f {
                return vec4f(color, 1.0);
            }
            `
        });

        const pipeline = device.createRenderPipeline({
            layout: "auto",
            vertex: { module: shaderModule, entryPoint: "vs_main" },
            fragment: { module: shaderModule, entryPoint: "fs_main", targets: [{ format }] },
            primitive: { topology: "triangle-list" }
        });

        // BUFFER DE MEMOIRE PARTAGEE (Uniform Buffer)
        const uniformBuffer = device.createBuffer({
            size: 16, // time(4) + width(4) + height(4) + padding(4)
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
        });

        const bindGroup = device.createBindGroup({
            layout: pipeline.getBindGroupLayout(0),
            entries: [{ binding: 0, resource: { buffer: uniformBuffer } }]
        });

        document.getElementById('status').innerText = "GPU Actif - 60 FPS";

        function render(now) {
            const timeData = new Float32Array([now / 1000, canvas.width, canvas.height, 0]);
            device.queue.writeBuffer(uniformBuffer, 0, timeData);

            const commandEncoder = device.createCommandEncoder();
            const textureView = context.getCurrentTexture().createView();

            const renderPass = commandEncoder.beginRenderPass({
                colorAttachments: [{
                    view: textureView,
                    clearValue: { r: 0, g: 0, b: 0, a: 1 },
                    loadOp: "clear", storeOp: "store"
                }]
            });

            renderPass.setPipeline(pipeline);
            renderPass.setBindGroup(0, bindGroup);

            // L'ORDRE MAGIQUE : Dessine 100 000 instances de 6 sommets chacune
            renderPass.draw(6, 100000);

            renderPass.end();
            device.queue.submit([commandEncoder.finish()]);

            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    }

    init();
</script>
</body>
</html>
