<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sokoban - Architecture Hexagonale</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>Sokoban</h1>
            <div class="game-info">
                <span class="level">Niveau: <span id="level-display">1</span></span>
                <span class="moves">Mouvements: <span id="moves-display">0</span></span>
                <span class="targets">Cibles: <span id="targets-status">0/0</span></span>
                <button id="reset-btn" class="btn">Reset</button>
                <button id="prev-level" class="btn">Précédent</button>
                <button id="next-level" class="btn">Suivant</button>
            </div>
        </header>

        <main class="game-board-container">
            <div id="game-board" class="game-board"></div>
        </main>

        <div class="controls">
            <div class="touch-controls">
                <div class="control-row">
                    <button class="control-btn" data-direction="up">↑</button>
                </div>
                <div class="control-row">
                    <button class="control-btn" data-direction="left">←</button>
                    <button class="control-btn" data-direction="down">↓</button>
                    <button class="control-btn" data-direction="right">→</button>
                </div>
            </div>
        </div>

        <div id="victory-modal" class="modal hidden">
            <div class="modal-content">
                <h2>🎉 Niveau terminé !</h2>
                <p>Félicitations ! Vous avez résolu le niveau en <span id="final-moves"></span> mouvements.</p>
                <div class="modal-buttons">
                    <button id="replay-level" class="btn btn-secondary">🔄 Rejouer</button>
                    <button id="next-level-modal" class="btn btn-primary">➡️ Niveau suivant</button>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
